name: scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ライセンスキーの要る Action は使わず、gitleaks 本体を取ってきて全履歴を検査する
      - name: gitleaks (全履歴)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tgz"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tgz}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tgz" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml .

      - name: 形の検査
        run: scripts/check-shape.sh

      - name: shellcheck
        run: |
          shellcheck -x install-all.sh capture.sh restore.sh lib/common.sh \
            xfce/install.sh node/install.sh optional/playwright/install.sh \
            desktop/install.sh desktop/lib/desktop.sh desktop/bin/* \
            hooks/pre-commit hooks/commit-msg scripts/*.sh
